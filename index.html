<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Family Tree Challenge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one fixed screen. Top bar, prompt, a stage that flexes to fill, feedback and buttons. Nothing scrolls. */
:root {
  --bg: #E9EDE8; --surface: #F7F9F6; --field: #FFFFFF; --ink: #1C2421; --muted: #56625C; --line: #C3CCC4;
  --accent: #A8561C; --accent-ink: #FFFFFF; --accent-soft: #F3E2D3;
  --good: #23784A; --good-soft: #DDF0E3; --bad: #B0362B; --bad-soft: #F8E1DD; --focus: #1F6FB2;
  --creature: #3B4A44; --star: #C98A12;
  --hl: #FFF0B8;
  --display: "Atkinson Hyperlegible", Verdana, "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", Verdana, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141A17; --surface: #1C2420; --field: #111714; --ink: #E4EAE5; --muted: #9AA8A0; --line: #34413A;
    --accent: #E08B45; --accent-ink: #1A0F06; --accent-soft: #3A2716; --good: #5FC88B; --good-soft: #17301F;
    --bad: #F0826F; --bad-soft: #3A1C17; --focus: #6AB0F0; --creature: #C5D1CA; --star: #F0B84A; --hl: #3D3612; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141A17; --surface: #1C2420; --field: #111714; --ink: #E4EAE5; --muted: #9AA8A0; --line: #34413A;
  --accent: #E08B45; --accent-ink: #1A0F06; --accent-soft: #3A2716; --good: #5FC88B; --good-soft: #17301F;
  --bad: #F0826F; --bad-soft: #3A1C17; --focus: #6AB0F0; --creature: #C5D1CA; --star: #F0B84A; --hl: #3D3612; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.4 var(--body); margin: 0; overflow: hidden; overscroll-behavior: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; }
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
#app { height: 100%; max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 8px; }

/* top bar */
#bar { display: flex; align-items: center; gap: 8px; min-height: 36px; }
#bar h1 { font: 700 clamp(16px, 4.4vw, 21px)/1.1 var(--display); margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#bar h1 small { font: 600 13px var(--body); color: var(--muted); margin-left: 6px; }
.btn { border: 2px solid var(--line); background: var(--surface); border-radius: 0; padding: 6px 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .45; cursor: default; }
.count { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.stars { color: var(--star); letter-spacing: 1px; white-space: nowrap; }
.stars i { font-style: normal; color: var(--line); }

/* home */
.home { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; }
.rule { margin: 0; color: var(--muted); font-size: 14px; }
.rule b { color: var(--ink); }
.worlds { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); grid-template-rows: repeat(4, minmax(0, 1fr)); min-height: 0; }
.world { background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 8px 10px; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 6px; min-height: 0; }
.world h2 { font: 700 16px/1.1 var(--display); margin: 0; display: flex; align-items: center; gap: 8px; }
.world h2 .ic { width: 40px; height: 24px; flex: none; }
.world h2 small { font: 400 13px var(--body); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.lvls { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; min-height: 0; }
.lvl { border: 2px solid var(--line); background: var(--field); border-radius: 0; padding: 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 0; overflow: hidden; }
.lvl b { font: 700 clamp(11px, 3.1vw, 14px)/1.1 var(--display); }
.lvl .stars { font-size: clamp(11px, 3vw, 14px); }
.lvl.next { border-color: var(--accent); background: var(--accent-soft); }
.lvl:disabled { opacity: .5; cursor: default; background: transparent; border-style: dashed; }
.homefoot { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 13px; }
.homefoot .btn { padding: 3px 9px; font-size: 13px; }
@media (min-aspect-ratio: 5/4) { .worlds { grid-template-columns: 1fr 1fr; grid-template-rows: repeat(2, minmax(0, 1fr)); } }

/* play */
.play { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; }
.prompt { margin: 0; font-size: clamp(14px, 3.9vw, 16px); line-height: 1.3; }
.prompt b { font-family: var(--display); font-weight: 700; }
.stage { min-height: 0; min-width: 0; display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
.foot { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; min-height: 54px; }
.fb { font-size: clamp(12.5px, 3.5vw, 14.5px); line-height: 1.3; margin: 0; min-width: 0; }
.fb.good b:first-child { color: var(--good); } .fb.bad b:first-child { color: var(--bad); }
.acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 46vw; }
.acts .num { min-width: 34px; padding: 6px 0; text-align: center; }

.ic { fill: currentColor; color: var(--creature); display: block; }
.ic .e { fill: var(--field); stroke: none; }
.chips { display: flex; flex-wrap: wrap; gap: 3px 4px; align-content: flex-start; min-width: 0; }
.chip { font-size: clamp(11px, 3vw, 12.5px); line-height: 1.2; padding: 2px 7px; border-radius: 0; border: 1px solid var(--line); background: var(--field); white-space: nowrap; }
.chip.hit { background: var(--good-soft); border-color: var(--good); font-weight: 700; }
.chip.no { border-style: dashed; color: var(--muted); }
.chip.x { background: var(--accent-soft); border-color: var(--accent); }

/* spot */
.cards { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); grid-template-rows: repeat(3, minmax(0, 1fr)); min-height: 0; }
.card { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 0; padding: 8px 10px; cursor: pointer; display: grid; grid-template-columns: clamp(64px, 22vw, 110px) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); column-gap: 10px; row-gap: 4px; min-height: 0; overflow: hidden; }
.card .ic { grid-row: 1 / 3; width: 100%; height: 100%; max-height: 90px; align-self: center; }
.card .cn { font: 700 18px/1.1 var(--display); align-self: center; }
.card:not(:has(.chips)) { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); align-items: center; }
.card:not(:has(.chips)) .ic { grid-row: auto; max-height: 100%; }
.card:not(:has(.chips)) .cn { font-size: clamp(18px, 5vw, 24px); }
.card.sel { border-color: var(--accent); background: var(--accent-soft); }
.card.good { border-color: var(--good); background: var(--good-soft); }
.card.bad { border-color: var(--bad); background: var(--bad-soft); }
.card:disabled { cursor: default; color: inherit; }
@media (min-aspect-ratio: 5/4) {
  .cards { grid-template-rows: minmax(0, 1fr); grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .card { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto auto; justify-items: center; text-align: center; }
  .card .ic { grid-row: auto; max-height: 150px; }
  .card .chips { justify-content: center; }
}

/* evidence table */
.tbl { display: grid; grid-template-columns: minmax(96px, 1.5fr) repeat(5, minmax(0, 1fr)); min-height: 0; height: 100%; border: 1px solid var(--line); border-radius: 0; overflow: hidden; background: var(--field); }
.tbl > * { border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 0 6px; display: flex; align-items: center; min-height: 0; min-width: 0; margin: 0; border-radius: 0; text-align: left; }
.tbl .th { flex-direction: column; justify-content: center; padding: 3px 2px; font: 700 clamp(9.5px, 2.6vw, 12.5px)/1.1 var(--body); background: var(--surface); text-align: center; hyphens: manual; }
.tbl .th .ic { width: 100%; max-width: 62px; height: clamp(18px, 6vw, 34px); }
.tbl .th.corner { align-items: flex-start; padding-left: 8px; color: var(--muted); }
.tbl .rl { font-size: clamp(11.5px, 3.2vw, 14px); font-weight: 600; line-height: 1.1; }
.tbl .c { justify-content: center; font-size: 15px; color: var(--muted); }
.tbl .c.y { color: var(--ink); }
.tbl .c.y::before { content: ""; width: 12px; height: 12px; border-radius: 0; background: currentColor; }
.tbl .c.n::before { content: "–"; opacity: .5; }
.tbl button { cursor: pointer; }
.tbl button.rl::after, .tbl button.th::after { content: ""; }
.tbl button.rl { text-decoration: underline dotted; text-underline-offset: 3px; }
.tbl button.th { outline: 2px dashed var(--accent); outline-offset: -4px; border-radius: 0; }
.tbl .foc { background: var(--accent-soft); }
.tbl.sp { grid-template-columns: minmax(92px, 1.25fr) repeat(3, minmax(0, 1fr)); }
.tbl.sp .th { gap: 2px; font-size: clamp(12.5px, 3.6vw, 16px); hyphens: manual; overflow-wrap: anywhere; }
.tbl.sp .th .ic { max-width: 112px; height: clamp(30px, 8.5vh, 72px); }
.tbl.sp .th.sel { background: var(--accent-soft); outline: 3px solid var(--accent); }
.tbl.sp .c.sel { background: var(--accent-soft); }
.tbl .hl { background: var(--hl); }
@keyframes rv { from { opacity: 0; } to { opacity: 1; } }
.tbl .rv { opacity: 0; animation: rv .5s ease-out forwards; }
.tbl.sp.locked .th { opacity: .6; outline-color: var(--line); cursor: default; }
.tbl.sp.locked .rl { text-decoration: none; cursor: default; }
.tbl .rl.lg { color: var(--good); font-size: clamp(13.5px, 3.9vw, 17px); font-weight: 700; }
.tbl .rl.lb { color: var(--bad); text-decoration: line-through; }
.tbl .c.y.tick::before { content: "\2713"; width: 1.55em; height: 1.55em; background: var(--good-soft); border: 2px solid var(--good); color: var(--good); display: grid; place-items: center; font: 700 clamp(13px, 3.6vw, 17px)/1 var(--body); }
.stage { position: relative; }
.play:has(.st-compare) { grid-template-rows: auto minmax(0, 1fr); }
.play:has(.st-compare) .foot { display: none; }
.float { position: absolute; z-index: 5; left: 50%; background: var(--surface); border: 3px solid var(--accent); box-shadow: 0 10px 30px rgba(0, 0, 0, .28); }
.pad { top: 50%; transform: translate(-50%, -50%); width: min(92%, 340px); padding: 14px; display: grid; gap: 10px; text-align: center; }
.pad p, .pop p { margin: 0; font-size: clamp(14px, 3.9vw, 16px); }
.pad .nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.pad .num { height: 54px; font: 700 24px var(--body); border: 2px solid var(--accent); background: var(--field); cursor: pointer; }
.pop { top: 50%; transform: translate(-50%, -50%); width: min(92%, 460px); padding: 14px; display: grid; gap: 10px; }
.pop.good { border-color: var(--good); } .pop.bad { border-color: var(--bad); }
.pop .row, .pad .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.float.dock { bottom: 10px; transform: translateX(-50%); padding: 6px; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.float.dock.good { border-color: var(--good); } .float.dock.bad { border-color: var(--bad); }
.float.dock .vb { font-weight: 700; padding: 0 6px; }
.float.dock.good .vb { color: var(--good); } .float.dock.bad .vb { color: var(--bad); }
.pop.good b:first-child { color: var(--good); } .pop.bad b:first-child { color: var(--bad); }
@keyframes pulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 var(--accent); } 50% { transform: scale(1.08); box-shadow: 0 0 0 6px transparent; } }
@media (prefers-reduced-motion: no-preference) { .pulse { animation: pulse 1.3s ease-in-out infinite; } }
@media (prefers-reduced-motion: reduce) { .pulse { outline: 3px solid var(--accent); outline-offset: 2px; } }
.tbl.sp .th.good { background: var(--good-soft); outline: 3px solid var(--good); }
.tbl.sp .th.bad { background: var(--bad-soft); outline: 3px solid var(--bad); }
.tbl.sp .c.y::before { width: 14px; height: 14px; }
.tbl .good { background: var(--good-soft); } .tbl .bad { background: var(--bad-soft); }

/* tree */
.treebox { min-height: 0; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 4px; }
svg.tree { width: 100%; height: 100%; display: block; }
.tree .br { stroke: var(--creature); stroke-width: 4; stroke-linecap: round; fill: none; }
.tree .jn { fill: var(--creature); }
.tree text { font-family: var(--body); fill: var(--ink); }
.tree .tn { font-weight: 700; text-anchor: middle; }
.tree .tb { fill: transparent; stroke: transparent; stroke-width: 2; }
.tree [data-tip], .tree [data-mark], .tree [data-node], .tree [data-dot] { cursor: pointer; }
.tree .slot .tb { fill: var(--field); stroke: var(--line); stroke-dasharray: 5 4; }
.tree .filled .tb { stroke-dasharray: none; }
.tree .opt .tb { stroke: var(--accent); stroke-dasharray: 5 4; fill: var(--field); }
.tree .foc .tb { fill: var(--accent-soft); stroke: var(--accent); }
.tree .sel .tb { fill: var(--accent-soft); stroke: var(--accent); stroke-dasharray: none; }
.tree .good .tb { fill: var(--good-soft); stroke: var(--good); stroke-dasharray: none; }
.tree .bad .tb { fill: var(--bad-soft); stroke: var(--bad); stroke-dasharray: none; }
.tree .pill rect { fill: var(--field); stroke: var(--creature); stroke-width: 1.5; }
.tree .pill text { font-weight: 700; text-anchor: middle; }
.tree .pill.slot rect { stroke: var(--accent); stroke-dasharray: 5 4; stroke-width: 2; }
.tree .pill.filled rect { stroke-dasharray: none; }
.tree .pill.bad rect { fill: var(--bad-soft); stroke: var(--bad); }
.tree .pill.good rect { fill: var(--good-soft); stroke: var(--good); }
.tree .nd { fill: var(--field); stroke: var(--accent); stroke-width: 3; }
.tree .nd.good { fill: var(--good); stroke: var(--good); } .tree .nd.bad { fill: var(--bad); stroke: var(--bad); }
.tree .dot circle { fill: var(--accent); stroke: var(--field); stroke-width: 2; }
.tree .dot text { fill: var(--accent-ink); font-weight: 700; text-anchor: middle; }
.tree .dot.bad circle { fill: var(--bad); opacity: .45; } .tree .dot.good circle { fill: var(--good); }
.tree .dot.off { opacity: .25; }

/* build tray and mystery card */
.tray { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; min-height: 44px; }
.tk { border: 2px solid var(--line); background: var(--field); border-radius: 0; padding: 3px 8px; font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
.tk .ic { width: 38px; height: 23px; }
.tk.f { border-radius: 0; border-color: var(--creature); padding: 5px 10px; }
.tk.sel { border-color: var(--accent); background: var(--accent-soft); }
.side { display: grid; gap: 8px; align-content: start; min-width: 0; }
.side p { margin: 0; font-size: 13px; color: var(--muted); }
.mcard { background: var(--surface); border: 2px solid var(--accent); border-radius: 0; padding: 8px 10px; display: grid; grid-template-columns: clamp(64px, 20vw, 100px) minmax(0, 1fr); gap: 4px 10px; align-items: center; }
.mcard .ic { width: 100%; height: auto; grid-row: 1 / 3; }
.mcard h3 { font: 700 16px/1.1 var(--display); margin: 0; }
.mcard h3 span { font: 700 11px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-left: 6px; }
.st-build { grid-template-rows: minmax(0, 1fr) auto; }
.st-mystery { grid-template-rows: auto minmax(0, 1fr); }
@media (min-aspect-ratio: 5/4) {
  .st-build, .st-mystery { grid-template-rows: minmax(0, 1fr); grid-template-columns: minmax(0, 1fr) minmax(210px, 30%); }
  .st-mystery .side { order: 2; }
  .tray { flex-direction: row; }
  .mcard { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .mcard .ic { grid-row: auto; max-width: 150px; } .mcard .chips { justify-content: center; }
}

/* overlay */
#ov { position: fixed; inset: 0; z-index: 20; background: rgba(10, 14, 12, .6); display: grid; place-items: center;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.panel { background: var(--bg); border: 1px solid var(--line); border-radius: 0; padding: 14px; width: min(100%, 560px); max-height: 100%; display: grid; gap: 10px; grid-template-rows: auto minmax(0, 1fr) auto; }
.panel h2 { font: 700 20px/1.1 var(--display); margin: 0; }
.panel p { margin: 0; }
.panel .big { font-size: 40px; text-align: center; line-height: 1; }
.panel .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.panel .tblwrap { min-height: 0; height: min(60vh, 420px); }
@media (prefers-reduced-motion: no-preference) { .card, .lvl, .tk { transition: background-color .12s, border-color .12s; } }
</style>

<div id="app">

  <main id="view"></main>
</div>

var GAME = {};

    tri.forEach(function (k, i) { var on = q.sel.indexOf(i) >= 0; h += '<button type="button" class="th ' + colCls(i) + '" data-card="' + i + '" aria-pressed="' + on + '"' + (q.done || lock ? ' disabled' : '') + '>' + icon(k) + '<span>' + nm(w, k).replace(/(saurus|cetus|worm|fly)$/, '&shy;$1') + '</span></button>'; });

  var cs = shuffle(w.taxa.map(function (t) { return t.k; }), r), fsh = shuffle(w.marks, r);
  L.rounds = [q]; L.max = 3;
  function placedF() { return Object.keys(q.marks).map(function (k) { return q.marks[k]; }).filter(Boolean); }

    setPrompt('<b>Build the tree.</b> Tap a creature or a feature tag, then tap where it goes. Every creature above a tag must have that feature.');
    var pf = placedF(), tray = cs.filter(function (k) { return q.tips.indexOf(k) < 0; }).map(function (k) { return '<button type="button" class="tk' + (q.sel === 'c:' + k ? ' sel' : '') + '" data-tray="c:' + k + '">' + icon(k) + nm(w, k) + '</button>'; }).join('') +
      fsh.filter(function (f) { return pf.indexOf(f) < 0; }).map(function (f) { return '<button type="button" class="tk f' + (q.sel === 'f:' + f ? ' sel' : '') + '" data-tray="f:' + f + '">' + fs(f) + '</button>'; }).join('');

    if (!q.done) setActs([{ t: 'Check tree', cls: 'pri', off: q.tips.indexOf(null) >= 0 || pf.length < w.marks.length, fn: check }]);
  };
  L.tap = function (key, v) {
    q.bad = {};
    if (key === 'tray') q.sel = q.sel === v ? null : v;
    if (key === 'tip') { if (q.sel && q.sel[0] === 'c') { q.tips[+v] = q.sel.slice(2); q.sel = null; } else q.tips[+v] = null; }
    if (key === 'mark') { if (q.sel && q.sel[0] === 'f') { q.marks[v] = q.sel.slice(2); q.sel = null; } else q.marks[v] = null; }

    w.T.nodes.forEach(function (n) {

    L.starsFixed = q.checks === 1 ? 3 : q.checks === 2 ? 2 : 1; L.summary = 'Tree solved in ' + q.checks + (q.checks === 1 ? ' check.' : ' checks.');

  }
};

/* 4. READ: answer questions by reading a finished tree */
GAME.read = function (L) {
  var w = L.w, r = L.rng, T = w.T, tris = shuffle(triples(w), r), ks = w.taxa.map(function (t) { return t.k; });
  tris.sort(function (a, b) { return hasTrap(b) - hasTrap(a); });
  function hasTrap(tri) { return w.traps.some(function (t) { return tri.indexOf(t.p[0]) >= 0 && tri.indexOf(t.p[1]) >= 0; }) ? 1 : 0; }
  function ti(k) { return T.tips.filter(function (n) { return n.tip === k; })[0].ti; }
  function qCloser() { var tri = tris.shift(), ans = closest(w, tri), z = tri.filter(function (k) { return ans.indexOf(k) < 0; })[0], sw = r() < 0.5; return { t: 'closer', x: ans[sw ? 0 : 1], y: ans[sw ? 1 : 0], z: z }; }
  var usedN = {};
  function qAnc() { var ps = shuffle(ks, r), a, b, n; for (var i = 0; i < 5; i++) for (var j = i + 1; j < 5; j++) { n = mrca(w, ps[i], ps[j]); if (!usedN[n.id] && !a) { a = ps[i]; b = ps[j]; usedN[n.id] = 1; } } if (!a) { a = ps[0]; b = ps[1]; } return { t: 'anc', a: a, b: b, n: mrca(w, a, b).id }; }
  var mk = shuffle(w.marks.filter(function (f) { return T.root.mark !== f; }), r);
  function qHas() { var f = mk.pop(), n = T.nodes.filter(function (x) { return x.mark === f; })[0]; return { t: 'has', f: f, want: n.idx.slice().sort().join(), sel: [] }; }
  L.rounds = [qCloser(), qAnc(), qHas(), qCloser(), qAnc(), qHas()]; L.max = 6;
  L.draw = function () {
    var q = L.r, o = { tipCls: {}, nodeCls: {} };
    if (q.t === 'closer') {
      setPrompt('<b>Which is the closer relative of the ' + nm(w, q.x) + ': the ' + nm(w, q.y) + ' or the ' + nm(w, q.z) + '?</b> Tap it on the tree.');
      o.tips = !q.done; o.tipCls[ti(q.x)] = 'foc'; o.tipCls[ti(q.y)] = q.done ? 'good' : 'opt'; o.tipCls[ti(q.z)] = q.done ? (q.pick === q.z ? 'bad' : '') : 'opt';
    }
    if (q.t === 'anc') {
      setPrompt('<b>Tap the branch point where the most recent common ancestor of the ' + nm(w, q.a) + ' and the ' + nm(w, q.b) + ' lived.</b>');
      o.nodes = true; o.tipCls[ti(q.a)] = o.tipCls[ti(q.b)] = 'foc'; if (q.done) { o.nodeCls[q.n] = 'good'; if (q.pick !== q.n) o.nodeCls[q.pick] = 'bad'; }
    }
    if (q.t === 'has') {
      setPrompt('<b>Tap every creature that inherited the “' + fs(q.f) + '” feature.</b> Then press Check.');
      o.tips = !q.done; var want = q.want.split(',').map(Number);
      T.tips.forEach(function (n) { var s = q.sel.indexOf(n.ti) >= 0, wv = want.indexOf(n.ti) >= 0; o.tipCls[n.ti] = q.done ? (wv ? 'good' : s ? 'bad' : '') : s ? 'sel' : ''; });
      if (!q.done) setActs([{ t: 'Check', cls: 'pri', off: !q.sel.length, fn: function () { var ok = q.sel.slice().sort().join() === q.want; verdict(ok, 'A feature tag marks where the feature first appeared. Every creature on the branches above the tag inherited it: ' + list(want.map(function (i) { return nm(w, T.tips[i].tip); })) + '.'); finishRound(ok ? 1 : 0); } }]);
    }
    $('#stage').innerHTML = '<div class="treebox">' + treeSVG(w, o) + '</div>';
  };
  L.tap = function (key, v) {
    var q = L.r;
    if (q.t === 'closer' && key === 'tip') { var k = T.tips[+v].tip; if (k !== q.y && k !== q.z) return; q.pick = k; verdict(k === q.y, 'Trace down from the ' + nm(w, q.x) + '. Its branch meets the ' + nm(w, q.y) + ' branch before it meets the ' + nm(w, q.z) + ' branch, so they share a more recent common ancestor.'); finishRound(k === q.y ? 1 : 0); }
    if (q.t === 'anc' && key === 'node') { q.pick = +v; verdict(q.pick === q.n, 'Trace down from each creature. Their branches first meet at the green point. That is where their most recent common ancestor lived.'); finishRound(q.pick === q.n ? 1 : 0); }
    if (q.t === 'has' && key === 'tip') { var at = q.sel.indexOf(+v); if (at >= 0) q.sel.splice(at, 1); else q.sel.push(+v); L.draw(); }
  };
};

/* 5. MYSTERY: place a new creature or fossil on the tree */
GAME.mystery = function (L) {
  var w = L.w;
  L.rounds = w.mystery.map(function (m) { return { m: m, cls: {}, tries: 0 }; }); L.max = 4;
  L.draw = function () {
    var q = L.r, m = q.m, cls = {}, k;

    if (q.done) w.T.nodes.forEach(function (n) { var id = n.tip ? 't:' + n.tip : 'b:' + n.mark; if (!cls[id]) cls[id] = 'off'; });
    setPrompt('<b>Where does the ' + m.n + ' join the tree?</b> Tap a <span style="color:var(--accent);font-weight:700">+</span> point. A point below a tag means it branched off before that feature appeared.');
    $('#stage').innerHTML = '<div class="side"><div class="mcard">' + icon(m.k) + '<h3>' + m.n + (m.fossil ? '<span>Fossil</span>' : '') + '</h3><div class="chips">' +
      m.has.map(function (f) { return '<span class="chip">' + fs(f) + '</span>'; }).join('') + m.extra.map(function (t) { return '<span class="chip x">' + t + '</span>'; }).join('') + m.lacks.map(function (t) { return '<span class="chip no">' + t + '</span>'; }).join('') +
      '</div></div></div><div class="treebox">' + treeSVG(w, { side: 124, dots: true, dotCls: cls }) + '</div>';
